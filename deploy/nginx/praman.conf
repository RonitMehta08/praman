# PRAMAN behind a TLS-terminating reverse proxy.
#
# docs/SECURITY.md §2: the application does not implement TLS and will not. This
# file is the other half of that sentence — the configuration, not an
# implementation. Adapt the two paths and the server_name; everything else is the
# part that is easy to get wrong.
#
# Requires nginx 1.19.3 or newer for `proxy_cookie_flags`. Check with
# `nginx -v` before deploying; on an older build, delete that directive and read
# the note beside it, because the alternative is not "it silently still works".
#
#   Upstream:  scripts/serve.py, which binds 127.0.0.1:8012 by default.
#   Install:   copy to /etc/nginx/conf.d/praman.conf, then `nginx -t` and reload.
#
# The upstream must stay on loopback. If nginx terminates TLS and uvicorn is also
# listening on 0.0.0.0:8012, an attacker simply talks to 8012 and the proxy has
# bought nothing — that is the single most common way this arrangement fails.

# The per-request rate limiter docs/SECURITY.md §4 lists as missing from the
# application. It belongs here: the app is single-process and synchronous, so the
# thing that needs protecting is CPU, and a proxy can refuse a request before it
# reaches Python at all. Keyed by client address rather than by operator, because
# an unauthenticated flood never presents a token.
limit_req_zone $binary_remote_addr zone=praman_api:10m rate=30r/s;
# Login is separate and far tighter. The application already locks a *username*
# out after ten failures; this bounds the other axis — one client working through
# many usernames — which the in-process lockout cannot see.
limit_req_zone $binary_remote_addr zone=praman_login:1m rate=6r/m;

upstream praman {
    server 127.0.0.1:8012;
    keepalive 8;
}

# Plain HTTP exists only to redirect. Serving anything over it would make the
# redirect optional, and a client that has already sent its Authorization header
# to port 80 has already leaked it.
server {
    listen 80;
    listen [::]:80;
    server_name praman.example.internal;

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name praman.example.internal;

    ssl_certificate     /etc/ssl/praman/fullchain.pem;
    ssl_certificate_key /etc/ssl/praman/privkey.pem;

    # TLS 1.2 is the floor because the tool's own rule packs fail devices for
    # accepting less. Cipher selection is left to the library defaults on 1.3;
    # `ssl_prefer_server_ciphers off` is the current guidance, not a leftover.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:praman_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # `always` so the header is present on error responses too. A 401 without
    # HSTS is a 401 the next request can be downgraded from.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # The UI is served from this same origin and loads no third-party script,
    # font or stylesheet — that is a requirement of the offline design, so it can
    # be enforced rather than merely documented. `data:` is for the inline SVG
    # favicon; charts are built with the CSSOM (`style.setProperty`), which CSP
    # does not restrict, so `style-src` needs no `unsafe-inline`.
    #
    # The one hash is index.html's boot watchdog, which cannot be moved to a file:
    # it exists to explain a page opened over `file://`, where nothing external
    # loads. `unsafe-inline` is deliberately absent — a browser ignores it once a
    # hash is present, so listing both would be a policy that reads as strict and
    # is not. tests/test_frontend_contract.py recomputes the hash from index.html
    # and fails if this line is stale, which is what makes a hash safe to ship.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self'; \
script-src 'self' 'sha256-+XiRwJYU3Be4Tf6/ZbcH7Q8GnuX0hDvxQLv+KbW+0qg='; \
frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Match backend/app/config.py MAX_UPLOAD_BYTES (64 MiB). Smaller here and a
    # legitimate estate archive is refused by the proxy with a 413 that says
    # nothing useful; larger and the limit the application enforces is the only
    # one, which is the position this line exists to improve on.
    client_max_body_size 64m;
    client_body_timeout 120s;

    # The session cookie is minted by the application without `Secure`, because
    # the application cannot know whether it is behind TLS and a `Secure` cookie
    # over plain HTTP on a LAN address is silently dropped by the browser — which
    # would break PDF downloads with no error anywhere. Adding the flag here is
    # correct: this is the only component that knows the answer. On nginx older
    # than 1.19.3 remove this line and accept that the cookie may be sent over a
    # downgraded connection; HSTS above is then the only thing preventing it.
    proxy_cookie_flags praman_session httponly secure samesite=strict;

    location / {
        limit_req zone=praman_api burst=60 nodelay;

        proxy_pass http://praman;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Report rendering is synchronous and a large estate PDF takes a while.
        # The default 60 s read timeout turns that into a 504 while the backend is
        # still working, and the operator sees a failure that did not happen.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /auth/login {
        limit_req zone=praman_login burst=3 nodelay;

        proxy_pass http://praman;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # /health is unauthenticated by design — it is what a process supervisor
    # polls, and gating it would mean handing a monitoring system a credential.
    # It reports version and rule counts, which is inventory, so it is restricted
    # by address instead of by role.
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;

        proxy_pass http://praman;
        proxy_set_header Host $host;
        access_log off;
    }

    # FastAPI's interactive documentation. Unauthenticated, and a complete map of
    # every route including the approver-only ones. Useful on a laptop, not on a
    # management network: it is refused here rather than disabled in the app, so a
    # developer running uvicorn directly still has it.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        deny all;
    }
}
