  # ── Sections that exist so their contents are attributable ────────────
  # Address objects, service objects and static routes are inventory rather than
  # posture, but they cannot simply be ignored: a policy's `srcaddr "RFC1918-BOGONS"`
  # is only auditable if something in the parse says what that name contains. These
  # blocks capture the object *names* and the route destinations, and send the
  # bodies to `ignore` above.

  - id: fgt_firewall_address
    anchor_path: acl.remark
    regex: '^config firewall (?:address|addrgrp|service custom|service group)\s*$'
    anchor_value: true
    mode: delimited
    end_regex: '^end\s*$'
    note: >
      Four object tables share one block because they share one shape and one
      compliance role: they are the vocabulary the policy table is written in. The
      alternation also keeps the depth count correct if a FortiGate emits them
      back-to-back with a nested `config` inside an entry.
    blocks:
      - id: fgt_address_row
        anchor_path: acl.name
        regex: '^edit\s+"(?P<value>[^"]+)"\s*$'
        anchor_value: str
        mode: delimited
        end_regex: '^next\s*$'
        children:
          - id: address_member
            regex: '^set member\s+(?P<value>.+?)\s*$'
            path: acl.entry.source
            value: word_list
          - id: address_type
            regex: '^set type\s+(?P<value>[\w-]+)\s*$'
            path: acl.entry.protocol
            value: lower
          - id: address_fqdn
            regex: '^set fqdn\s+"?(?P<value>[^"]+)"?\s*$'
            path: acl.entry.destination
            value: str
          - id: address_start_ip
            regex: '^set start-ip\s+(?P<value>[\d.]+)\s*$'
            path: acl.entry.source
            value: str
          - id: address_end_ip
            regex: '^set end-ip\s+(?P<value>[\d.]+)\s*$'
            path: acl.entry.destination
            value: str

  - id: fgt_router_static
    anchor_path: routing.ip_routing
    regex: '^config router static\s*$'
    anchor_value: true
    mode: delimited
    end_regex: '^end\s*$'
    blocks:
      - id: fgt_static_route_row
        anchor_path: routing.static_route
        regex: '^edit\s+(?P<value>\d+)\s*$'
        anchor_value: str
        mode: delimited
        end_regex: '^next\s*$'
        children:
