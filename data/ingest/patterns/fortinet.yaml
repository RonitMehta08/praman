  - id: fgt_snmp_user
    anchor_path: snmp.user
    regex: '^config system snmp user\s*$'
    anchor_value: true
    mode: delimited
    end_regex: '^end\s*$'
    blocks:
      - id: fgt_snmp_user_row
        anchor_path: snmp.group
        regex: '^edit\s+"(?P<value>[^"]+)"\s*$'
        anchor_value: str
        mode: delimited
        end_regex: '^next\s*$'
        children:
          - id: snmp_user_security_level
            regex: '^set security-level\s+(?P<value>\S+)\s*$'
            emits:
              - {path: snmp.group_security, value: lower}
              - {path: snmp.version, value: const, literal: v3}
            note: >
              A `config system snmp user` entry *is* an SNMPv3 user — FortiOS has
              no other place to put one. Claiming the version here is what lets
              the "only v3 is enabled" control be decided: without it the pack
              recorded v3 credentials but never recorded that v3 was in use, so
              the rule had to infer it from the presence of a hash algorithm.
          - id: snmp_user_auth_proto
            regex: '^set auth-proto\s+(?P<value>\S+)\s*$'
            path: snmp.v3_auth
            value: lower
          - id: snmp_user_priv_proto
            regex: '^set priv-proto\s+(?P<value>\S+)\s*$'
            path: snmp.v3_priv
            value: lower
          - id: snmp_user_notify_hosts
            regex: '^set notify-hosts\s+(?P<value>[\d.]+)\s*$'
            path: snmp.trap_host
            value: str

