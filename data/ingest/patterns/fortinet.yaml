        note: >
          A route row with a `gateway` and no `dst` is the default route — FortiOS
          omits `dst 0.0.0.0 0.0.0.0` rather than writing it. So `gateway` maps to
          `routing.default_route` and `dst` to `routing.static_route`, and a row
