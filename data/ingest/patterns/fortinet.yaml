# FortiOS ships far more locked down than IOS, and the defaults below say so
# explicitly rather than leaving a rule to guess. Each is a documented factory
# default of FortiOS 7.x, not an assumption: `show` omits a setting only when it
# still holds its factory value, which is what makes these safe to assert.
defaults:
  mgmt.telnet.enabled:
    value: false
    reason: >
      `admin-telnet` defaults to disable on FortiOS 7.x, and telnet is absent from
      the factory `allowaccess` list on every interface
  crypto.fips_mode:
    value: false
    reason: FIPS-CC mode is off unless `set fips-cc-mode enable` is present
  crypto.cipher_suite:
    value: disable
    reason: >
      `strong-crypto` defaults to disable, which leaves SHA-1 and the weak SSH
      ciphers enabled — the first control the CIS benchmark checks
  mgmt.login_banner:
    value: false
    reason: the pre-login disclaimer is off until `set pre-login-banner enable`
  mgmt.motd_banner:
    value: false
    reason: the post-login banner is off until `set post-login-banner enable`
  logging.enable:
    value: false
    reason: no `config log syslogd setting` section is present
  logging.config_changes:
    value: false
    reason: >
      administrative event logging is off until `set admin-audit-log enable` is
      configured
  snmp.enabled:
    value: false
    reason: >
      the SNMP agent is disabled at factory defaults and no `config system snmp
      sysinfo` section enables it here
  time.ntp.authentication:
    value: false
    reason: NTP authentication is off unless `set authentication enable` is present
  service.password_recovery:
    value: true
    reason: >
      the `maintainer` console-recovery account is enabled by default, so a
      configuration that does not disable it leaves physical-access recovery open
  ha.redundancy:
    value: standalone
    reason: no `config system ha` section is present, so the unit is standalone
