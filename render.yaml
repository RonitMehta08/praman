# Hosted sample workspace with self-service operator signup and CPU classifiers.
services:
  - type: web
    name: praman-demo
    runtime: python
    plan: free
    buildCommand: sh deploy/build-online.sh
    startCommand: sh deploy/start-online.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.11"
      - key: PYTHONUTF8
        value: "1"
      - key: SENTINEL_AI_BACKEND
        value: classifiers
      - key: PRAMAN_SIGNUP_ENABLED
        value: "true"
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
