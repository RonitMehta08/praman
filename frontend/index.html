<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PRAMAN — network configuration compliance auditor</title>
  <meta name="description" content="PRAMAN — multi-vendor network security compliance auditor. Ingest configurations, evaluate them against CIS, NIST SP 800-53, DISA STIG and ISO 27001, and sign each audit into an append-only ledger.">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">

  <!--
    No CDN. The previous version of this file preconnected to fonts.googleapis.com
    and loaded Inter from fonts.gstatic.com. PRAMAN is offline-first by requirement
    and is expected to run on air-gapped estates, where those three requests hang
    until they time out and the first paint is blocked behind them. Type is a local
    system-font stack instead — see app.css.

    Everything else the page needs is served by this application: no script, style,
    font or image is fetched from another origin, at load or afterwards.
  -->
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a78d6'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='bold' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">

  <!--
    Not inline, and not deferred. It has to run before first paint or a dark-mode
    operator gets a full-page white flash; it has to be a file so the deployed
    Content-Security-Policy can be `script-src 'self'` without listing a hash for
    it. See frontend/js/theme-preload.js and deploy/nginx/praman.conf.
  -->
  <script src="/js/theme-preload.js"></script>
</head>
<body>
  <!--
    The shell is built in JavaScript rather than written out here, so there is
    exactly one definition of the chrome and the router owns the whole outlet.
    What sits in this div until then is a boot state, not a layout.
  -->
  <div id="app">
    <div class="boot" role="status" aria-live="polite">
      <span class="boot-mark" aria-hidden="true">◈</span>
      <p class="boot-title">PRAMAN</p>
      <p class="boot-note">Starting the interface…</p>
      <noscript>
        <p class="boot-error">
          This interface is a JavaScript application and will not render without it.
          The API it talks to does not need a browser: every screen here corresponds to
          an HTTP endpoint documented at <code>/docs</code>, and per-device PDF reports
          are available at <code>/devices/{device_id}/report.pdf</code>.
        </p>
      </noscript>
    </div>
  </div>

  <script type="module" src="/js/main.js"></script>
  <!--
    The one inline script in this file, and it cannot be moved out.
    An external script would have to load to run, and the failure it exists to
    explain — the page opened as a `file://` URL, where module imports are blocked
    and `/js/...` resolves to the filesystem root — is precisely the case where
    nothing external loads. So it stays here, and the deployed CSP lists its
    SHA-256 rather than allowing inline script generally
    (deploy/nginx/praman.conf). `tests/test_frontend_contract.py` recomputes that
    hash from this block, so editing the script fails the suite instead of
    silently disabling the diagnostic in production.
  -->
  <script type="module">
    setTimeout(function () {
      var boot = document.querySelector('#app .boot');
      if (!boot) return;
      var note = boot.querySelector('.boot-note');
      if (note) {
        note.className = 'boot-error';
        note.textContent =
          'The interface did not start. If this page was opened as a file:// URL, ' +
          'module imports are blocked by the browser — open it through the server ' +
          'instead: .venv/Scripts/python.exe -m uvicorn backend.app.main:app --port 8000, ' +
          'then http://127.0.0.1:8000/. Otherwise the browser console will name the ' +
          'module that failed.';
      }
    }, 4000);
  </script>
</body>
</html>
