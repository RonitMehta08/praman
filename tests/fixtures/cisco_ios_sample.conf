!
! Sample Cisco IOS 15 Running Configuration (test fixture)
! This is a deliberately insecure config for testing purposes.
!
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service pad
!
hostname test-fixture-sw01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$fixture$abcdefghijklmnop
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
aaa accounting commands 15 default start-stop group tacacs+
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
ip http secure-server
!
snmp-server community public RO
snmp-server host 10.0.0.100
snmp-server enable traps
!
logging host 10.0.0.200
logging buffered 16384 informational
logging trap informational
logging console informational
!
ntp server 10.0.0.50
ntp authenticate
ntp authentication-key 1 md5 ntpkey123
ntp trusted-key 1
!
banner login ^
*****WARNING*****
Unauthorized access is prohibited.
All activity is logged and monitored.
^
!
banner motd ^
System maintenance window: Sunday 02:00-04:00 UTC
^
!
interface Vlan1
 description Management VLAN
 ip address 10.0.0.10 255.255.255.0
 no shutdown
!
interface Vlan99
 description Unused VLAN
 shutdown
!
interface GigabitEthernet0/1
 description Uplink to Core
 ip address 10.0.1.1 255.255.255.252
 no shutdown
!
line con 0
 exec-timeout 5 0
 login authentication default
 transport input none
!
line aux 0
 no exec
!
line vty 0 4
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class 10 in
!
line vty 5 15
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class 10 in
!
ip access-list extended MGMT-ACL
 10 permit ip 10.0.0.0 0.0.0.7 any
 20 deny ip any any log
!
no ip source-route
!
end
