! ============================================================================
! PRAMAN test fixture — crypto, IPsec/IKEv2 and IS-IS coverage
! ============================================================================
! Category : feature_coverage
! Vendor   : cisco_ios
! Purpose  : Regression coverage for canonical paths that the CIS IOS 15
!            benchmark does not reach, so no compliance fixture exercises them.
!            Three of them exist because a semantic bug was found by inspection
!            and must not come back:
!
!   crypto.ikev2.group    'group 14' inside an IKEv2 proposal used to be emitted
!                         as mgmt.ssh.key_exchange_group, so an SSH key-exchange
!                         rule would have been decided by a VPN setting.
!   crypto.ipsec.mode     'mode tunnel' used to be emitted as vpn.pfs, so a
!                         perfect-forward-secrecy control would have been decided
!                         by an encapsulation mode.
!   routing.isis.process  'router isis' used to anchor on routing.isis.auth, so
!                         the mere existence of an IS-IS process asserted that
!                         IS-IS authentication was configured — a false negative
!                         on the whole point of the control.
!
!            This file also carries an intentionally weak IKEv1/ISAKMP policy so
!            future crypto rules have a failing case to be written against.
! ============================================================================
version 15.7
service timestamps debug datetime msec localtime show-timezone
service password-encryption
!
hostname SENTINEL-VPN-R1
!
ip domain-name sentinel.example.net
!
crypto key generate rsa general-keys modulus 4096
!
crypto pki trustpoint SENTINEL-CA
 enrollment url http://10.10.10.20:80
 revocation-check crl
!
! Weak by design: DH group 2 and 3DES give future crypto rules a failing case.
crypto isakmp policy 10
 encryption 3des
 hash sha
 group 2
 lifetime 86400
!
crypto ikev2 proposal SENTINEL-IKEV2
 encryption aes-cbc-256
 integrity sha512
 group 14
!
crypto ipsec transform-set SENTINEL-TS esp-aes 256 esp-sha512-hmac
 mode tunnel
!
router isis CORE
 authentication mode md5
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
!
interface Loopback0
 ip address 10.255.0.9 255.255.255.255
!
interface GigabitEthernet0/0
 description IPsec transport
 ip address 10.40.0.1 255.255.255.252
 no ip proxy-arp
 no ip redirects
 no shutdown
!
line con 0
 exec-timeout 5 0
!
line vty 0 4
 exec-timeout 5 0
 transport input ssh
!
end
