! ============================================================================
! PRAMAN test fixture — CIS Cisco IOS 15 v4.1.1, deliberately fully violating
! ============================================================================
! Category : compliance_extremes (negative pole)
! Vendor   : cisco_ios
! Purpose  : This is the false-negative detector, and false negatives outrank
!            false positives in this project's testing policy: a missed finding
!            is a device left exposed while the report says it is fine. Every
!            control this file PASSES is a candidate bug — either a rule that
!            cannot see the violation, or a canonical path the pattern pack never
!            emits for the insecure form of the command.
!            Controls that come back 'notapplicable' here are also worth reading:
!            each one is a control whose violation this file failed to express.
! Pairs with: fully_hardened.conf (the positive pole).
!
! WARNING: every credential below is a well-known default or the literal string
! 'cisco'. This file exists to be flagged. Do not copy any line of it.
! ============================================================================
version 15.7
service timestamps debug uptime
service timestamps log uptime
!
hostname Router
!
enable password cisco
!
username admin privilege 15 password cisco
username backup password 7 070C285F4D061A33
!
ip identd
!
! CISC-ND-000460 / -000380 / -000390 (V-215677, V-215675, V-215676). DISA's own
! example of the violation is 'file privilege 10' — any level other than 15
! lets a non-privileged session reach the flash filesystem and thus the stored
! audit log. Persistent logging is enabled so that the two audit-protection
! controls are applicable here rather than notapplicable: a control this fixture
! cannot express is a control tested in only one direction.
file privilege 10
logging persistent url disk0:/logfile size 134217728 filesize 16384
!
! CISC-ND-001440 (V-215711) — a trust point with no enrollment URL. The router
! has a public key certificate, so the control applies, but nothing records
! which CA it enrolled with.
crypto pki trustpoint LEGACY-CA
!
crypto key generate rsa general-keys modulus 1024
!
ip ssh authentication-retries 5
!
no logging on
logging buffered debugging
logging console debugging
logging trap alerts
!
ntp server pool.ntp.org
!
snmp-server community public RW
snmp-server community private RO
snmp-server group MONITOR v3 noauth read ALL
snmp-server user monitor MONITOR v3 auth md5 070C285F4D061A33 priv des 070C285F4D061A33
!
interface Tunnel0
 description legacy GRE to branch, no authentication
 ip address 172.16.99.1 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 203.0.113.9
!
interface GigabitEthernet0/0
 description internet uplink
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description user access
 ip address 192.168.1.1 255.255.255.0
 ip directed-broadcast
 no shutdown
!
router eigrp 100
 network 192.168.1.0 0.0.0.255
!
router ospf 1
 network 192.168.1.0 0.0.0.255 area 0
!
router rip
 network 192.168.0.0
!
router bgp 65001
 neighbor 203.0.113.2 remote-as 65002
!
line con 0
 exec-timeout 0 0
 login
 password cisco
!
line aux 0
 exec-timeout 0 0
 login
 password cisco
 transport input all
!
line tty 1 8
 exec-timeout 0 0
 login
!
line vty 0 4
 exec-timeout 0 0
 login
 password cisco
 transport input all
!
line vty 5 15
 no exec-timeout
 no login
 transport input telnet ssh
!
end
