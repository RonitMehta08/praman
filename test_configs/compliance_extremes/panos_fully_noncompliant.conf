# PAN-OS pole fixture: the failing direction.
#
# The twin of panos_fully_hardened.conf. Every automated CIS Palo Alto Firewall
# 11 control must return **fail** here, and the two files together are what
# proves each PAN-OS rule can move in both directions. A rule that fires on the
# hardened file and never fires here would be one that cannot detect the
# violation it exists to detect — a false pass waiting for a real device, and
# the failure mode this project treats as worse than a crash.
#
# Failing every control is harder than it sounds, and three of them are the
# reason:
#
# * **1.5.1, 1.6.3 and 7.4 are scoped by `requires_paths`.** Deleting the
#   feature makes them `notapplicable`, which is a verdict but not a *failing*
#   one, so it would leave the rule untested in this direction. Each therefore
#   has to stay present and be wrong: SNMP enabled but v2c, a tunnel that
#   terminates but authenticates with nothing, a policy that exists but is
#   silent.
# * **Several controls fail on absence** (`on_missing: fail`), so for those the
#   violation is a line that is simply not here. Where that is the mechanism it
#   is stated in a comment, because an absent line is invisible in review and
#   the next person to "tidy up" this file would otherwise restore it.
#
# This device is not a caricature — everything below is a configuration a real
# firewall could genuinely be in, and most of it is what a device looks like
# when it was stood up quickly and never revisited.
#
# Every credential-shaped string is a REDACTED* placeholder, never a real secret.
# show system info
# hostname: pa-pole-violating-01
# model: PA-3220
# serial: 012801000002
# sw-version: 11.1.2
# operational-mode: normal
# multi-vsys: off
# ---- show config running | set-format --------------------------------
set deviceconfig system hostname pa-pole-violating-01
set deviceconfig system domain corp.example.net
set deviceconfig system type static
set deviceconfig system ip-address 10.99.0.22
set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 10.99.0.254
set deviceconfig system timezone Asia/Kolkata

# 1.1.2 fails by absence: no `login-banner` line exists, so mgmt.login_banner is
# never emitted and the presence check has nothing to find. The MOTD banner
# below is a different fact and does not satisfy the control.
set deviceconfig system motd-and-banner banner-header "pa-pole-violating-01"
set deviceconfig system dns-setting servers primary 10.20.0.53

# 1.2.3 and 1.2.4 — cleartext management left on, which is the state a device
# ships in when someone enabled HTTP "temporarily" to get a browser working.
set deviceconfig system service disable-telnet no
set deviceconfig system service disable-http no
set deviceconfig system service disable-https no
set deviceconfig system service disable-ssh no
set deviceconfig system service disable-icmp no

# SNMP stays enabled so 1.5.1 is applicable rather than notapplicable. It fails
# below on the version, not on absence.
set deviceconfig system service disable-snmp no
set deviceconfig system service disable-userid-service no

# 1.2.1 and 1.2.2 fail by absence: no `permitted-ip` line, so the management
# plane is reachable from every network the firewall touches. On PAN-OS one
# permitted-ip list answers the SSH, HTTPS and SNMP controls at once, so
# omitting it is what fails both controls together.
set deviceconfig system ssh ciphers mgmt aes128-cbc
set deviceconfig system ssh mac mgmt hmac-sha1
set deviceconfig system ssh default-hostkey mgmt key-type RSA

# 1.6.2 — exactly one NTP server. The control asks for redundancy by number, so
# a single working source fails it: this is not a device with a broken clock,
# it is a device with no second opinion about the time.
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.30.0.10

# 1.1.1.2 and 1.5.1 — SNMP v2c. The community travels in cleartext and is
# replayable, and the trap host below inherits the same weakness. 1.5.1's
# quantifier is `all`, so this single v2c line is enough to fail it even if a v3
# user were also present.
set deviceconfig system snmp-setting snmp-system location "Mumbai DC1 Rack A05"
set deviceconfig system snmp-setting access-setting version v2c snmp-community-string REDACTEDPANOSCOMMUNITYFIXTURE
set deviceconfig system update-server updates.paloaltonetworks.com

# 1.4.1 — thirty minutes. The pack normalises PAN-OS minutes to seconds, so this
# lands at 1800 against a 600-second ceiling.
set deviceconfig setting management idle-timeout 30

# 1.4.2 fails on both halves: `failed-attempts 0` is PAN-OS for "never lock
# out", and no `lockout-time` line exists at all. The rule checks both, because
# a count with no lockout locks nobody out and a lockout with no count never
# triggers.
set deviceconfig setting management admin-lockout failed-attempts 0
set deviceconfig setting session timeout-tcp 3600

# 3.1 fails by absence: no high-availability stanza. `ha.redundancy` and
# `ha.sync` are only emitted by `enabled yes` and
# `configuration-synchronization enabled yes` respectively, so a standalone
# firewall produces neither fact and the rule fails on missing evidence.
set mgt-config users admin phash $5$REDACTEDPANOSADMINSALT$REDACTEDPANOSADMINHASHFIXTURE
set mgt-config users admin permissions role-based superuser yes

# 1.3.1, 1.3.2, 1.3.7, 1.3.9 — the password policy, wrong in four ways. Note
# that `expiration-period 0` is PAN-OS for "never expire": 1.3.7 checks `gt 0`
# as well as `lte 90` precisely so the least secure setting the platform offers
# cannot pass a naive ceiling check.
set mgt-config password-complexity enabled no
set mgt-config password-complexity minimum-length 8
set mgt-config password-complexity password-history-count 3
set mgt-config password-complexity expiration-period 0
set shared server-profile radius RADIUS-DC1 server RAD-1 ip-address 10.20.0.80
set shared server-profile radius RADIUS-DC1 server RAD-1 secret -AQ==REDACTEDPANOSRADIUSSECRETONE
set shared authentication-profile CORP-RADIUS method radius server-profile RADIUS-DC1

# 1.2.5 fails by absence: no `ssl-tls-service-profile ... certificate` line and
# no certificate profile, so crypto.pki.trustpoint is never emitted and the
# browser-based administrator session is served by the factory self-signed
# certificate — identical across the product line, which is what trains
# administrators to click through the warning.

# 1.1.1.1 fails by absence: no `log-settings syslog` stanza, so nothing leaves
# the box. The local log rotates, and on a firewall that is usually the only
# record that an intrusion's traffic existed at all.

# 1.1.1.2 — a trap destination does exist, so the control is not failing on a
# missing host; it fails because the version above is v2c.
set shared log-settings snmptrap SNMP-TRAPS server TRAP-1 manager 10.99.0.50
set network profiles interface-management-profile MGMT-OPEN ping yes
set network profiles interface-management-profile MGMT-OPEN telnet yes
set network profiles interface-management-profile MGMT-OPEN http yes
set network profiles interface-management-profile MGMT-OPEN https yes
set network profiles interface-management-profile MGMT-OPEN ssh yes
set zone untrust network layer3 [ ethernet1/1 ]
set zone trust network layer3 [ ethernet1/2 ]
set zone vpn network layer3 [ tunnel.1 ]
set network interface ethernet ethernet1/1 comment WAN-UPLINK
set network interface ethernet ethernet1/1 layer3 ip 198.51.100.30/29
set network interface ethernet ethernet1/1 layer3 interface-management-profile MGMT-OPEN
set network interface ethernet ethernet1/2 comment LAN-DOWNLINK
set network interface ethernet ethernet1/2 layer3 ip 10.20.0.22/24
set network interface ethernet ethernet1/2 layer3 interface-management-profile MGMT-OPEN
set network interface tunnel units tunnel.1 ip 10.254.1.5/30
set network interface tunnel units tunnel.1 comment IPSEC-OVERLAY-TO-DC2
set network virtual-router default interface [ ethernet1/1 ethernet1/2 tunnel.1 ]
set network virtual-router default routing-table ip static-route DEFAULT-ROUTE destination 0.0.0.0/0
set network virtual-router default routing-table ip static-route DEFAULT-ROUTE nexthop ip-address 198.51.100.25
set network ike crypto-profiles ike-crypto-profiles IKE-WEAK dh-group group2
set network ike crypto-profiles ike-crypto-profiles IKE-WEAK encryption 3des
set network ike crypto-profiles ipsec-crypto-profiles IPSEC-WEAK esp encryption 3des
set network ike gateway IKE-GW-DC2 protocol version ikev1
set network ike gateway IKE-GW-DC2 peer-address ip 203.0.113.9

# 1.6.3 — the tunnel must keep terminating for the control to stay applicable,
# so the IPsec stanza below is deliberately intact: it emits
# vpn.tunnel.encryption, which is the `requires_paths` gate. What is missing is
# any `authentication` line on the gateway, so vpn.tunnel.auth is never emitted
# and the presence check fails. Deleting the tunnel instead would report
# notapplicable and leave this rule unexercised in the failing direction, which
# is the trap this comment exists to stop someone walking into.
set network tunnel ipsec TUNNEL-DC2 auto-key ike-gateway IKE-GW-DC2
set network tunnel ipsec TUNNEL-DC2 auto-key ipsec-crypto-profile IPSEC-WEAK
set network tunnel ipsec TUNNEL-DC2 tunnel-interface tunnel.1
set address INSIDE-NET ip-netmask 10.20.0.0/24
set service service-https protocol tcp port 443

# 7.4 — policies exist (so firewall.policy.name is emitted and the control is
# applicable) but every one of them is silent. The two built-in defaults are the
# interesting case: PAN-OS ships them with logging off, they are where traffic
# nobody wrote a rule for lands, and they are the most commonly missed logs on
# the device. The quantifier is `all`, so even the named rules below logging
# would not save it.
set rulebase security rules ALLOW-ANY-OUTBOUND description "temporary, 2023"
set rulebase security rules ALLOW-ANY-OUTBOUND from [ trust ]
set rulebase security rules ALLOW-ANY-OUTBOUND to [ untrust ]
set rulebase security rules ALLOW-ANY-OUTBOUND source any
set rulebase security rules ALLOW-ANY-OUTBOUND destination any
set rulebase security rules ALLOW-ANY-OUTBOUND application any
set rulebase security rules ALLOW-ANY-OUTBOUND action allow
set rulebase security rules ALLOW-ANY-OUTBOUND log-end no
set rulebase security rules ALLOW-VENDOR-SUPPORT from [ untrust ]
set rulebase security rules ALLOW-VENDOR-SUPPORT to [ trust ]
set rulebase security rules ALLOW-VENDOR-SUPPORT source any
set rulebase security rules ALLOW-VENDOR-SUPPORT destination any
set rulebase security rules ALLOW-VENDOR-SUPPORT application any
set rulebase security rules ALLOW-VENDOR-SUPPORT action allow
set rulebase security rules ALLOW-VENDOR-SUPPORT log-end no
set rulebase default-security-rules rules intrazone-default action allow
set rulebase default-security-rules rules intrazone-default log-end no
set rulebase default-security-rules rules interzone-default action deny
set rulebase default-security-rules rules interzone-default log-end no
set rulebase nat rules SNAT-OUTBOUND from [ trust ]
set rulebase nat rules SNAT-OUTBOUND to [ untrust ]
set rulebase nat rules SNAT-OUTBOUND source [ INSIDE-NET ]
set rulebase nat rules SNAT-OUTBOUND source-translation dynamic-ip-and-port interface-address interface ethernet1/1
set vsys vsys1 display-name POLE-VIOLATING
set vsys vsys1 import network interface [ ethernet1/1 ethernet1/2 tunnel.1 ]
