! ============================================================================
! PRAMAN test fixture — deliberately fully hardened
! ============================================================================
! Category : compliance_extremes (positive pole)
! Vendor   : cisco_ios
! Packs    : CIS Cisco IOS 15 v4.1.1  +  DISA STIG Cisco IOS Router NDM v3r8
! Purpose  : This is the false-positive detector. Every control this file
!            FAILS is a candidate bug in the mapping packs, because the config
!            satisfies each benchmark's own published remediation text for
!            every control the engine claims to automate. A rules change that
!            starts failing a control here has broken a compliant device, which
!            is the failure mode that ends an auditor's trust in the tool.
!
! On the DISA half, every command below is taken from the fix_text of the
! control it satisfies rather than invented, so the fixture is traceable to the
! publisher document and not to this project's reading of it.
!
! One control cannot be satisfied on this platform at all: V-215698 (NTP
! authentication) — DISA's own check text says "Cisco IOS is limited to MD5 for
! NTP authentication, and incurs a permanent finding as it is not FIPS
! compliant." The fixture configures NTP authentication exactly as the fix_text
! shows and still fails, which is the correct verdict. See
! tests/test_rules_mapping.py::PLATFORM_PERMANENT_FINDINGS.
! Pairs with: fully_noncompliant.conf (the negative pole).
! ============================================================================
version 15.7
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no service dhcp
no service config
no service finger
no service tcp-small-servers
no service udp-small-servers
!
! CISC-ND-000470 (V-215678) — the publisher's own list of services that must
! not appear in the configuration.
no ip bootp server
no ip boot server
no ip dns server
no ip identd
no ip finger
no ip http server
no ip http secure-server
no ip rcmd rcp-enable
no ip rcmd rsh-enable
no ip source-route
no boot network
no cdp run
!
hostname SENTINEL-EDGE-R1
!
boot-start-marker
boot system flash:c2900-universalk9-mz.SPA.157-3.M.bin
boot-end-marker
!
! CISC-ND-000460 / -000380 / -000390 (V-215677, V-215675, V-215676). IOS
! defaults this to 15 and omits it from the running config, so it is written
! out explicitly here to prove the rule reads the configured value and not its
! own on_missing default.
file privilege 15
!
enable secret 5 $1$Kd7f$q0N8sTvHhZ2mXbEwR3aLu.
!
! CISC-ND-000490 (V-215679) — exactly one local account, as the account of last
! resort for when the TACACS+ servers are unreachable. A second local account
! is a finding, which is why this fixture carries one and only one.
username auditor privilege 1 secret 5 $1$Rp2m$8LxQeN4vTgYbHcWzA9sKj/
!
aaa new-model
!
! CISC-ND-000550 through -000610 (V-215681 … V-215686). The Common Criteria
! policy is where IOS 15 keeps the password composition rules DISA states one
! directive at a time.
aaa common-criteria policy DOD-CC-POLICY
 min-length 15
 max-length 64
 upper-case 1
 lower-case 1
 numeric-count 1
 special-case 1
 char-changes 8
!
aaa group server tacacs+ SENTINEL-TAC
 server-private 10.10.10.11 key 7 070C285F4D061A33
 server-private 10.10.10.12 key 7 070C285F4D061A33
 ip tacacs source-interface Loopback0
!
aaa authentication login default group SENTINEL-TAC local
aaa authentication login SENTINEL-MGMT group SENTINEL-TAC local
aaa authentication enable default group SENTINEL-TAC enable
aaa authorization exec default group SENTINEL-TAC local
aaa authorization commands 15 default group SENTINEL-TAC local
aaa accounting exec default start-stop group SENTINEL-TAC
aaa accounting commands 15 default start-stop group SENTINEL-TAC
aaa accounting commands 1 default start-stop group SENTINEL-TAC
aaa accounting connection default start-stop group SENTINEL-TAC
aaa accounting network default start-stop group SENTINEL-TAC
aaa accounting system default start-stop group SENTINEL-TAC
!
! CISC-ND-000150 (V-215668) and -001260 (V-215704).
login block-for 900 attempts 3 within 120
login on-success log
login on-failure log
!
ip tacacs source-interface Loopback0
ip tftp source-interface Loopback0
ip domain-name sentinel.example.net
!
crypto key generate rsa general-keys modulus 2048
!
! CISC-ND-001440 (V-215711) — enrolled with a CA, so the control is applicable
! here rather than notapplicable.
crypto pki trustpoint DOD-ID-CA
 enrollment url http://ca.sentinel.example.net:80
!
! CISC-ND-001200 (V-215699) and -001210 (V-215700) — FIPS-validated HMAC and
! cipher suites. Absent these two lines the IOS defaults include hmac-sha1 and
! 3des-cbc, which is why the rules read on_missing: fail.
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm mac hmac-sha2-256 hmac-sha2-512
ip ssh server algorithm encryption aes256-ctr aes192-ctr aes128-ctr
!
clock timezone IST 5 30
ntp authenticate
ntp authentication-key 1 md5 070C285F4D061A33
ntp trusted-key 1
ntp source Loopback0
ntp server 10.10.10.1 key 1
ntp server 10.10.10.2 key 1
!
logging on
logging buffered 64000 informational
logging console critical
logging trap informational
logging source-interface Loopback0
logging host 10.10.10.5
logging host 10.10.10.6
!
! CISC-ND-000210 (V-215670) — administrator activity and configuration-change
! auditing. 'log config' only opens the sub-stanza; 'logging enable' is the
! directive that actually records a change.
logging userinfo
logging persistent url disk0:/logfile size 134217728 filesize 16384
!
archive
 path flash:archive-cfg
 write-memory
 log config
  logging enable
  logging size 1000
  notify syslog contenttype plaintext
  hidekeys
!
snmp-server community S3nt1nelR0 view SENTINEL-VIEW RO SNMP-ACL
snmp-server group SENTINEL-RO v3 priv read SENTINEL-VIEW
snmp-server user auditor SENTINEL-RO v3 auth sha 070C285F4D061A33 priv aes 128 070C285F4D061A33
snmp-server enable traps snmp authentication linkdown linkup coldstart
snmp-server host 10.10.10.7 version 3 priv auditor
!
banner exec ^C
Authorized use only. Activity on this device is logged and monitored.
^C
banner login ^C
You are accessing a U.S. Government (USG) Information System (IS) that is
provided for USG-authorized use only. By using this IS, you consent to the
following conditions: the USG routinely intercepts and monitors communications
on this IS; at any time, the USG may inspect and seize data stored on this IS;
communications using, or data stored on, this IS are not private.
^C
banner motd ^C
NOTICE: SENTINEL-EDGE-R1 is a production device under change control.
^C
!
interface Loopback0
 description management loopback
 ip address 10.255.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description uplink to core
 ip address 10.20.0.1 255.255.255.252
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no ip directed-broadcast
 ip verify unicast source reachable-via rx
 no shutdown
!
interface GigabitEthernet0/1
 description branch access
 ip address 10.30.0.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no ip directed-broadcast
 no shutdown
!
interface GigabitEthernet0/2
 description reserved
 no ip address
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 shutdown
!
router eigrp 100
 authentication mode md5
 authentication key-chain EIGRP-KEYS
 network 10.20.0.0 0.0.0.3
 no auto-summary
!
router ospf 1
 area 0 authentication message-digest
 passive-interface default
 network 10.30.0.0 0.0.0.255 area 0
!
router rip
 authentication mode md5
 authentication key-chain RIP-KEYS
 network 10.0.0.0
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 10.20.0.2 remote-as 65002
 neighbor 10.20.0.2 password 7 070C285F4D061A33
 neighbor 10.20.0.2 maximum-prefix 500
!
ip access-list standard SNMP-ACL
 permit 10.10.10.0 0.0.0.255
 deny any log
!
ip access-list extended VTY-MGMT
 permit tcp 10.10.0.0 0.0.255.255 any eq 22
 deny ip any any log
!
line con 0
 exec-timeout 5 0
 login authentication SENTINEL-MGMT
 transport output none
!
line aux 0
 no exec
 exec-timeout 5 0
 transport input none
 transport output none
!
line tty 1 8
 exec-timeout 5 0
 login authentication SENTINEL-MGMT
!
! CISC-ND-000010 (V-215662) — concurrent session limiting, and -000140
! (V-215667) — an inbound ACL on every vty line.
line vty 0 4
 access-class VTY-MGMT in
 session-limit 2
 exec-timeout 5 0
 login authentication SENTINEL-MGMT
 transport input ssh
 transport output none
!
line vty 5 15
 access-class VTY-MGMT in
 session-limit 2
 exec-timeout 5 0
 login authentication SENTINEL-MGMT
 transport input ssh
 transport output none
!
! CISC-ND-001220 (V-215701) — CoPP on the route processor.
control-plane
 service-policy input CoPP-POLICY
!
end
