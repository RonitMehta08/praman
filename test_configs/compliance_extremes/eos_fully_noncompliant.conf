! Arista EOS pole fixture: the failing direction.
!
! Not a realistic switch, and not a plausible one. This file exists to violate
! *every* automated DISA STIG control for Arista MLS EOS 4.x at once — both
! catalogs, NDM v2r2 and Layer-2 Switch v2r3 — so that its hardened twin can pass
! every one of them. The pair together is what proves each rule can move in both
! directions. A rule that can only ever return one verdict is not tested by a
! fixture that only ever produces that verdict, and a rule that returns the same
! verdict on a hardened switch and on this one is not reading anything at all.
!
! Paired with eos_fully_hardened.conf, and derived from it, so every difference
! below is a deliberate violation rather than an accident of authorship.
!
! Two mechanisms are in play, and they need different treatment:
!
!  * Controls that fail on *absence* — a `presence` or `count` condition, or a
!    `fact_check` with `on_missing: fail`. These are violated by deleting the
!    line. V-255950 (login banner), V-255966 (syslog host), V-255969 (storm
!    control), V-255974 (uRPF) and V-255982 (trunk allowed VLANs) are all here.
!
!  * Controls scoped by `applies_to.requires_paths`. Deleting the line makes
!    these `notapplicable`, which is a verdict but not a failing one, so the
!    control would go unexercised in this direction and the fixture would be
!    quietly lying about its coverage. They must be present-but-wrong instead.
!    V-255957 keeps `username` lines and drops only `privilege`; V-255959 keeps
!    SNMP enabled and downgrades the v3 auth to MD5; V-255981 keeps an access
!    VLAN and sets it to 1; V-255985 keeps a native VLAN and sets it to 1.
!
! V-255979 was a third case until it was fixed. It was scoped
! `requires_paths: [interface.switchport_mode]` *and* carried `on_missing: fail`,
! and `requires_paths` is evaluated first — so absence returned `notapplicable`
! and the `on_missing: fail` was dead code. The rule could only ever answer
! `pass` or `notapplicable`: it had no failing direction on any input. Its
! bad-value list is Cisco DTP vocabulary (`dynamic auto`, `dynamic desirable`)
! that no EOS config can produce, because EOS implements no DTP — DISA's own
! Arista L2S STIG says so by omission, writing only `switchport mode trunk` and
! `switchport mode access` for this platform and dropping the
! `switchport nonegotiate` that its Cisco IOS equivalent prescribes. Building
! this fixture is what surfaced that; the rationale in the mapping pack carries
! the argument. The scope is gone, so absence now fails, which is what the check
! text describes: a port carrying trunk attributes with no static mode set is a
! trunk that was not "enabled statically". Hence no `switchport mode` line and no
! `no switchport` anywhere below.
!
! Every credential-shaped string is a REDACTED* placeholder, never a real secret.
! Weak algorithms appear deliberately and are the point of the fixture.
! Command: show running-config
! device: arista-pole-noncompliant-01 (DCS-7050SX3-48YC8, EOS-4.30.3M)
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
service unsupported-transceiver arista 0x0
!
platform sand lag hardware-only
hardware counter feature route ipv4
!
queue-monitor length
event-monitor
sflow sample 16384
sflow destination 10.20.0.60
sflow run
!
! V-255966: no syslog host at all, so nothing is shipped off the box.
! V-255962: trap level raised to critical, which drops everything an audit needs.
logging format timestamp high-resolution
logging format hostname fqdn
logging trap critical
logging buffered 16384 informational
logging monitor critical
logging console debugging
logging level aaa errors
!
hostname arista-pole-noncompliant-01
ip name-server vrf MGMT 10.20.0.53
dns domain corp.example.net
ip domain-list corp.example.net
!
! V-255958: one time source and no authentication, so time is unverified and
! a single upstream can move it.
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 10.30.0.10 prefer
!
clock timezone Asia/Kolkata
!
! V-255959: SNMPv3 authentication downgraded to MD5. SNMP stays enabled so the
! control's `requires_paths: [snmp.enabled]` is still satisfied and the rule is
! forced to a verdict rather than excused.
snmp-server engineID local 8000000903001c73aabbcc
snmp-server location Mumbai DC1 Rack C07
snmp-server contact netops@corp.example.net
snmp-server vrf MGMT
snmp-server view SNMP-RO-VIEW iso included
snmp-server group SNMPV3-PRIV v3 priv read SNMP-RO-VIEW
snmp-server user snmpv3-monitor SNMPV3-PRIV v3 auth md5 REDACTEDEOSSNMPAUTHFIXTURE priv aes 256 REDACTEDEOSSNMPPRIVFIXTURE
snmp-server host 10.99.0.50 vrf MGMT version 3 priv snmpv3-monitor
snmp-server enable traps link linkDown linkUp
!
! V-255977: spanning tree off entirely.
! V-255971, V-255972: no global BPDU guard, no loop guard.
spanning-tree mode none
!
errdisable recovery interval 300
!
aaa root secret sha512 $6$REDACTEDEOSROOTSALT$REDACTEDEOSROOTHASHFIXTURE
!
! V-255949: lockout threshold raised to 10 failed attempts.
! V-255951: no command accounting, so privileged actions leave no trail.
! V-255963: no AAA server group, so authentication falls back to the local
! database with nothing centralised behind it.
aaa authentication policy on-failure log
aaa authentication policy lockout failure 10 window 300 duration 900
aaa authentication login default local
aaa authentication login console local
aaa authentication enable default local
aaa authorization exec default local
!
tacacs-server host 10.20.0.70 vrf MGMT key 7 REDACTEDEOSTACACSKEYFIXTURE
tacacs-server timeout 5
ip tacacs vrf MGMT source-interface Management1
!
! V-255957: named accounts with no privilege level. `username` is still present,
! satisfying `requires_paths: [mgmt.local_user.name]`, so the control is
! evaluated and fails rather than being skipped as inapplicable.
username admin role network-admin secret sha512 $6$REDACTEDEOSADMINSALT$REDACTEDEOSADMINHASHFIXTURE
username netops role network-admin secret sha512 $6$REDACTEDEOSNETOPSSALT$REDACTEDEOSNETOPSHASHFIXTURE
username auditor nopassword
!
! V-255965: TLS profile gone and cleartext HTTP enabled on the API.
! V-255948: no management-plane ACL on any access method.
! V-255956: idle timeout raised to 30 minutes.
management api http-commands
   protocol http
   idle-timeout 30
   !
   vrf MGMT
      no shutdown
!
management console
   idle-timeout 30
!
management defaults
   secret hash md5
!
! V-255954: minimum password length dropped to 8.
! V-255955: FIPS restrictions disabled.
management security
   entropy source haveged
   password minimum length 8
   password history 0
   no fips restrictions
!
! V-255960: HMAC-MD5 and HMAC-SHA1 message authentication.
! V-255961: 3DES and AES-CBC ciphers.
management ssh
   idle-timeout 30
   login timeout 120
   authentication mode password
   cipher 3des-cbc aes128-cbc
   key-exchange diffie-hellman-group14-sha1
   mac hmac-md5 hmac-sha1
   hostkey server ssh-rsa
   log-level errors
   !
   vrf MGMT
      no shutdown
!
! V-255952: telnet left running.
management telnet
   idle-timeout 30
   no shutdown
!
! V-255950: no login banner, so no notice-and-consent before authentication.
banner motd
Contact netops@corp.example.net for authorised access requests.
EOF
!
vlan 1
   name default
!
vlan 10
   name USER-ACCESS
!
vlan 20
   name VOICE
!
vlan 30
   name SERVERS
!
vrf instance MGMT
!
! V-255973: DHCP snooping disabled, which also removes the binding table that
! IP Source Guard and Dynamic ARP Inspection would have read.
no ip dhcp snooping
!
lldp timer 30
lldp holdtime 120
!
ip access-list DATA-EGRESS
   10 remark Server segment may reach the patch mirror over TLS only
   20 permit tcp 10.100.0.0/24 any eq https
   30 deny ip any any log
!
! V-255979: not one interface below carries `switchport mode` or `no switchport`,
! so no port is statically configured and the control fails on absence.
! V-255974: no `ip verify unicast source reachable-via rx` anywhere.
! V-255969: no storm control anywhere.
interface Ethernet1
   description UPLINK-TO-SPINE-1
   switchport trunk native vlan 1
   mtu 9214
   speed forced 10000full
!
interface Ethernet2
   description UPLINK-TO-SPINE-2
   switchport trunk native vlan 1
   mtu 9214
!
! V-255981: user-facing access ports left in the default VLAN.
interface Ethernet10
   description ACCESS-USER-DESK-BLOCK-A
   switchport access vlan 1
!
interface Ethernet11
   description ACCESS-VOICE-DESK-BLOCK-A
   switchport access vlan 1
!
! V-255985: native VLAN 1 on a trunk, carrying untagged control traffic.
! V-255982: no allowed-VLAN list, so every VLAN on the switch crosses the trunk.
! V-255970: no root guard, so an attached switch can take the STP root.
interface Ethernet20
   description TRUNK-TO-SERVER-RACK-C07
   switchport trunk native vlan 1
!
interface Ethernet46
   switchport access vlan 1
!
interface Ethernet47
   description SPARE-LEFT-ENABLED
!
interface Ethernet48
   description SPARE-DECOMMISSIONED-2025-06
!
interface Loopback0
   description ROUTER-ID
   ip address 10.255.255.13/32
!
interface Management1
   description OOB-MANAGEMENT
   vrf MGMT
   ip address 10.99.0.13/24
!
interface Vlan10
   description SVI-USER-ACCESS
   ip address 192.168.1.13/24
   ip helper-address 10.20.0.40
!
interface Vlan30
   description SVI-SERVERS
   ip address 10.100.0.13/24
   ip access-group DATA-EGRESS out
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 10.99.0.254
ip route 0.0.0.0/0 10.255.0.0
!
router ospf 100
   router-id 10.255.255.13
   max-lsa 12000
!
router bgp 65001
   router-id 10.255.255.13
   maximum-paths 4 ecmp 4
   neighbor SPINE peer group
   neighbor SPINE remote-as 65000
   neighbor SPINE maximum-routes 12000
   neighbor 10.255.0.0 peer group SPINE
   network 10.255.255.13/32
   address-family ipv4
!
boot system flash:/EOS-4.30.3M.swi
!
end
