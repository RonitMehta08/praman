# PAN-OS pole fixture: the passing direction.
#
# Not a realistic firewall. `multivendor/panos_perimeter_firewall.conf` is the
# realistic one, and it fails three controls for real reasons argued in the
# mapping pack header. This file exists to satisfy *every* automated CIS Palo
# Alto Firewall 11 control at once, so that its violating twin can fail every
# one of them and the pair together proves each rule can move in both
# directions. A rule that can only ever return one verdict is not tested by a
# fixture that only ever produces that verdict.
#
# Where this file is deliberately unrealistic, and why it does not matter: a
# real firewall would not carry a 24-password history *and* a 90-day expiry
# *and* two NTP servers *and* an HA peer *and* a terminated VPN tunnel, because
# few sites need all of them. The pair's job is to move every rule, not to model
# a plausible estate.
#
# Paired with panos_fully_noncompliant.conf. Any control added to the PAN-OS
# mapping pack must be satisfied here and violated there, or
# test_every_control_is_exercised_in_both_directions fails — which is the point.
#
# Every credential-shaped string is a REDACTED* placeholder, never a real secret.
# show system info
# hostname: pa-pole-hardened-01
# model: PA-3220
# serial: 012801000001
# sw-version: 11.1.2
# operational-mode: normal
# multi-vsys: off
# ---- show config running | set-format --------------------------------
set deviceconfig system hostname pa-pole-hardened-01
set deviceconfig system domain corp.example.net
set deviceconfig system type static
set deviceconfig system ip-address 10.99.0.21
set deviceconfig system netmask 255.255.255.0
set deviceconfig system default-gateway 10.99.0.254
set deviceconfig system timezone Asia/Kolkata

# 1.1.2 — the pre-authentication legal notice.
set deviceconfig system login-banner "UNAUTHORISED ACCESS PROHIBITED. This system is monitored and all activity may be recorded and disclosed to law enforcement. Disconnect immediately if you are not an authorised user of Example Corp network operations."
set deviceconfig system motd-and-banner banner-header "EXAMPLE CORP POLE FIXTURE - hardened"
set deviceconfig system dns-setting servers primary 10.20.0.53
set deviceconfig system dns-setting servers secondary 10.20.0.54

# 1.2.3 and 1.2.4 — cleartext management off. Both controls read these two
# lines through different canonical paths (mgmt.* and service.*), which is why
# the pack maps them as separate controls rather than one.
set deviceconfig system service disable-telnet yes
set deviceconfig system service disable-http yes
set deviceconfig system service disable-https no
set deviceconfig system service disable-ssh no
set deviceconfig system service disable-icmp no

# 1.5.1 is scoped by requires_paths to devices running the agent, so SNMP is
# enabled here on purpose: switching it off would make the control notapplicable
# rather than pass, and a notapplicable does not exercise the rule.
set deviceconfig system service disable-snmp no
set deviceconfig system service disable-userid-service yes

# 1.2.1 and 1.2.2 — permitted-ip answers the SSH, HTTPS and SNMP source
# restriction controls at once; PAN-OS scopes it to the whole management plane.
set deviceconfig system permitted-ip 10.20.0.0/24 description JUMP-HOST-SUBNET
set deviceconfig system permitted-ip 10.99.0.0/24 description OOB-MANAGEMENT-SUBNET
set deviceconfig system ssh ciphers mgmt aes256-gcm@openssh.com
set deviceconfig system ssh mac mgmt hmac-sha2-512
set deviceconfig system ssh kex mgmt ecdh-sha2-nistp521
set deviceconfig system ssh default-hostkey mgmt key-type ECDSA
set deviceconfig system ssh session-rekey mgmt interval 3600

# 1.6.2 — two NTP sources. The control names a number, so one server fails it.
set deviceconfig system ntp-servers primary-ntp-server ntp-server-address 10.30.0.10
set deviceconfig system ntp-servers primary-ntp-server authentication-type symmetric-key algorithm sha1 authentication-key REDACTEDPANOSNTPKEYFIXTURE
set deviceconfig system ntp-servers secondary-ntp-server ntp-server-address 10.30.0.11
set deviceconfig system ntp-servers secondary-ntp-server authentication-type symmetric-key algorithm sha1 authentication-key REDACTEDPANOSNTPKEYTWOFIXTURE

# 1.1.1.2 and 1.5.1 — SNMPv3 only, for both polling and traps. The quantifier on
# 1.5.1 is `all`, so a single v2c community line anywhere would fail it.
set deviceconfig system snmp-setting snmp-system location "Mumbai DC1 Rack A05"
set deviceconfig system snmp-setting snmp-system contact netops@corp.example.net
set deviceconfig system snmp-setting access-setting version v3 views SNMP-RO-VIEW view iso oid 1.3.6.1 option include
set deviceconfig system snmp-setting access-setting version v3 users snmpv3-monitor view SNMP-RO-VIEW
set deviceconfig system snmp-setting access-setting version v3 users snmpv3-monitor authpwd REDACTEDPANOSSNMPAUTHFIXTURE
set deviceconfig system snmp-setting access-setting version v3 users snmpv3-monitor privpwd REDACTEDPANOSSNMPPRIVFIXTURE
set deviceconfig system authentication-profile CORP-AUTH-SEQ
set deviceconfig system update-server updates.paloaltonetworks.com
set deviceconfig system server-verification yes

# 1.4.1 — ten minutes is the benchmark ceiling and the pack normalises PAN-OS
# minutes to seconds on the way in, so this lands as exactly 600.
set deviceconfig setting management idle-timeout 10

# 1.4.2 — both halves of the lockout, each non-zero.
set deviceconfig setting management admin-lockout failed-attempts 3
set deviceconfig setting management admin-lockout lockout-time 15
set deviceconfig setting management hostname-type-in-syslog FQDN
set deviceconfig setting session timeout-tcp 3600

# 3.1 — an HA peer that is also configuration-synchronised. The control asks for
# both, because a peer whose config has diverged fails over into a posture that
# was never audited.
set deviceconfig high-availability enabled yes
set deviceconfig high-availability interface ha1 ip-address 10.254.0.1
set deviceconfig high-availability group 1 configuration-synchronization enabled yes
set deviceconfig high-availability group 1 peer-ip 10.254.0.2
set mgt-config users admin phash $5$REDACTEDPANOSADMINSALT$REDACTEDPANOSADMINHASHFIXTURE
set mgt-config users admin permissions role-based superuser yes
set mgt-config users netops phash $5$REDACTEDPANOSNETOPSSALT$REDACTEDPANOSNETOPSHASHFIXTURE
set mgt-config users netops permissions role-based custom profile NETOPS-RW

# 1.3.1, 1.3.2, 1.3.7, 1.3.9 — the password policy. 24 remembered passwords is
# the number this benchmark states; the pack honours it as written rather than
# softening it to the 5 a real site often runs.
set mgt-config password-complexity enabled yes
set mgt-config password-complexity minimum-length 15
set mgt-config password-complexity minimum-uppercase-letters 2
set mgt-config password-complexity minimum-lowercase-letters 2
set mgt-config password-complexity minimum-numeric-letters 2
set mgt-config password-complexity minimum-special-characters 1
set mgt-config password-complexity block-username-inclusion yes
set mgt-config password-complexity password-history-count 24
set mgt-config password-complexity expiration-period 90
set mgt-config password-complexity expiration-warning-period 7
set shared server-profile tacplus TACACS-DC1 protocol CHAP
set shared server-profile tacplus TACACS-DC1 server TAC-1 address 10.20.0.70
set shared server-profile tacplus TACACS-DC1 server TAC-1 port 49
set shared server-profile tacplus TACACS-DC1 server TAC-1 secret -AQ==REDACTEDPANOSTACACSSECRETONE
set shared authentication-profile CORP-TACACS method tacplus server-profile TACACS-DC1
set shared authentication-profile CORP-TACACS lockout failed-attempts 3
set shared authentication-profile CORP-TACACS lockout lockout-time 15
set shared authentication-profile LOCAL-FALLBACK method local-database
set shared authentication-sequence CORP-AUTH-SEQ authentication-profiles [ CORP-TACACS LOCAL-FALLBACK ]

# 1.2.5 — a named local certificate rather than the factory self-signed one.
set shared certificate-profile CORP-CERT-PROFILE CA CORP-ROOT-CA
set shared certificate-profile CORP-CERT-PROFILE use-crl yes
set shared certificate-profile CORP-CERT-PROFILE block-unknown-cert yes
set shared ssl-tls-service-profile MGMT-TLS certificate FW-ID-CERT
set shared ssl-tls-service-profile MGMT-TLS protocol-settings min-version tls1-2
set shared ssl-tls-service-profile MGMT-TLS protocol-settings max-version tls1-3

# 1.1.1.1 — an off-box collector, so the record survives log rotation and an
# attacker with administrative access to this device.
set shared log-settings syslog SIEM-PROFILE server SIEM-1 server 10.20.0.50
set shared log-settings syslog SIEM-PROFILE server SIEM-1 transport SSL
set shared log-settings syslog SIEM-PROFILE server SIEM-1 port 6514
set shared log-settings syslog SIEM-PROFILE server SIEM-2 server 10.20.0.51

# 1.1.1.2 — the trap destination. A v3 user with no destination sends nothing.
set shared log-settings snmptrap SNMP-TRAPS server TRAP-1 manager 10.99.0.50
set shared log-settings snmptrap SNMP-TRAPS server TRAP-1 version v3 user snmpv3-monitor
set shared log-settings config match-list CFG-AUDIT send-syslog [ SIEM-PROFILE ]
set shared log-settings system match-list SYS-CRIT send-syslog [ SIEM-PROFILE ]
set network profiles interface-management-profile MGMT-PING-ONLY ping yes
set network profiles interface-management-profile MGMT-PING-ONLY telnet no
set network profiles interface-management-profile MGMT-PING-ONLY http no
set network profiles interface-management-profile MGMT-PING-ONLY permitted-ip 10.20.0.0/24
set network profiles interface-management-profile OOB-ADMIN ssh yes
set network profiles interface-management-profile OOB-ADMIN https yes
set network profiles interface-management-profile OOB-ADMIN permitted-ip 10.99.0.0/24
set network profiles zone-protection-profile ZP-INTERNET flood tcp-syn enable yes
set network profiles zone-protection-profile ZP-INTERNET discard-ip-spoof yes
set zone untrust network layer3 [ ethernet1/1 ]
set zone untrust network zone-protection-profile ZP-INTERNET
set zone trust network layer3 [ ethernet1/2 ]
set zone vpn network layer3 [ tunnel.1 ]
set network interface ethernet ethernet1/1 comment WAN-UPLINK
set network interface ethernet ethernet1/1 layer3 ip 198.51.100.20/29
set network interface ethernet ethernet1/1 layer3 interface-management-profile MGMT-PING-ONLY
set network interface ethernet ethernet1/2 comment LAN-DOWNLINK
set network interface ethernet ethernet1/2 layer3 ip 10.20.0.21/24
set network interface ethernet ethernet1/2 layer3 interface-management-profile MGMT-PING-ONLY
set network interface tunnel units tunnel.1 ip 10.254.1.1/30
set network interface tunnel units tunnel.1 comment IPSEC-OVERLAY-TO-DC2
set network virtual-router default interface [ ethernet1/1 ethernet1/2 tunnel.1 ]
set network virtual-router default routing-table ip static-route DEFAULT-ROUTE destination 0.0.0.0/0
set network virtual-router default routing-table ip static-route DEFAULT-ROUTE nexthop ip-address 198.51.100.17
set network ike crypto-profiles ike-crypto-profiles IKE-AES256-GCM dh-group group20
set network ike crypto-profiles ike-crypto-profiles IKE-AES256-GCM encryption aes-256-gcm
set network ike crypto-profiles ipsec-crypto-profiles IPSEC-AES256-GCM esp encryption aes-256-gcm
set network ike crypto-profiles ipsec-crypto-profiles IPSEC-AES256-GCM dh-group group20
set network ike gateway IKE-GW-DC2 protocol version ikev2

# 1.6.3 — certificate-profile authentication rather than a shared secret. The
# control is scoped by requires_paths to devices that terminate a tunnel, so the
# tunnel below is what makes it applicable at all.
set network ike gateway IKE-GW-DC2 authentication certificate certificate-profile CORP-CERT-PROFILE
set network ike gateway IKE-GW-DC2 authentication certificate local-certificate name FW-ID-CERT
set network ike gateway IKE-GW-DC2 peer-address ip 203.0.113.9
set network tunnel ipsec TUNNEL-DC2 auto-key ike-gateway IKE-GW-DC2
set network tunnel ipsec TUNNEL-DC2 auto-key ipsec-crypto-profile IPSEC-AES256-GCM
set network tunnel ipsec TUNNEL-DC2 tunnel-interface tunnel.1
set address DMZ-WEB-SRV ip-netmask 192.168.1.20/32
set address INSIDE-NET ip-netmask 10.20.0.0/24
set service service-https protocol tcp port 443
set profiles vulnerability VULN-STRICT rules BLOCK-CRITICAL action reset-both
set profiles virus AV-STRICT decoder http action reset-both
set profile-group SPG-STRICT virus [ AV-STRICT ]
set profile-group SPG-STRICT vulnerability [ VULN-STRICT ]

# 7.4 — every security policy logs, including both built-in defaults, which ship
# with logging off and are where traffic nobody wrote a rule for lands. The
# quantifier is `all`: one silent policy is a blind spot regardless of the rest.
set rulebase security rules ALLOW-WEB-INBOUND description "Published web front end"
set rulebase security rules ALLOW-WEB-INBOUND from [ untrust ]
set rulebase security rules ALLOW-WEB-INBOUND to [ trust ]
set rulebase security rules ALLOW-WEB-INBOUND source any
set rulebase security rules ALLOW-WEB-INBOUND destination [ DMZ-WEB-SRV ]
set rulebase security rules ALLOW-WEB-INBOUND application [ ssl web-browsing ]
set rulebase security rules ALLOW-WEB-INBOUND action allow
set rulebase security rules ALLOW-WEB-INBOUND log-end yes
set rulebase security rules ALLOW-WEB-INBOUND log-setting SIEM-PROFILE
set rulebase security rules ALLOW-WEB-INBOUND profile-setting group [ SPG-STRICT ]
set rulebase security rules ALLOW-SITE-TO-SITE description "IPsec overlay to DC2"
set rulebase security rules ALLOW-SITE-TO-SITE from [ trust vpn ]
set rulebase security rules ALLOW-SITE-TO-SITE to [ trust vpn ]
set rulebase security rules ALLOW-SITE-TO-SITE source [ INSIDE-NET ]
set rulebase security rules ALLOW-SITE-TO-SITE application any
set rulebase security rules ALLOW-SITE-TO-SITE action allow
set rulebase security rules ALLOW-SITE-TO-SITE log-end yes
set rulebase default-security-rules rules intrazone-default action allow
set rulebase default-security-rules rules intrazone-default log-end yes
set rulebase default-security-rules rules interzone-default action deny
set rulebase default-security-rules rules interzone-default log-end yes
set rulebase nat rules SNAT-OUTBOUND from [ trust ]
set rulebase nat rules SNAT-OUTBOUND to [ untrust ]
set rulebase nat rules SNAT-OUTBOUND source [ INSIDE-NET ]
set rulebase nat rules SNAT-OUTBOUND source-translation dynamic-ip-and-port interface-address interface ethernet1/1
set vsys vsys1 display-name POLE-HARDENED
set vsys vsys1 import network interface [ ethernet1/1 ethernet1/2 tunnel.1 ]
