! ============================================================================
! PRAMAN test fixture — branch router, config bundled with 'show version' only
! ============================================================================
! Category : device_identity
! Vendor   : cisco_ios
! Purpose  : The commoner half of PRAMAN's device-identity requirement. Most
!            collection scripts capture 'show version' and stop — 'show
!            inventory' is a second command somebody has to remember. So the
!            serial has to be recoverable from the version banner alone, where
!            IOS prints it under two different headings:
!
!              System serial number     : FTX1840ALBE   ← the chassis
!              Processor board ID         FTX1840ALBE   ← the same number again
!
!            They are the same string, which is why the dedup in
!            generic.py._build_device() has to collapse them: a report listing
!            the chassis serial twice reads like two devices.
!
!            The same block also prints two component serials —
!            'Motherboard serial number: FOC18396K2N' and 'Power supply serial
!            number: AZS183503LK'. Neither is captured, deliberately. Note that
!            here the motherboard serial DIFFERS from the chassis serial, so
!            capturing it would put a number in device.serials that matches
!            nothing in any asset register. Both lines are in the pack's ignore
!            list; see the note beside inventory_pid_sn.
!
!            Pairs with stacked_switch_with_inventory.conf, which supplies the
!            'show inventory' path and the multi-member case.
!
! Asserted : tests/test_device_identity.py
!            serials  == FTX1840ALBE   (exactly one chassis, one serial)
!            hardware includes CISCO2921/K9
!            service.password_recovery is absent — an ISR does not report it
!
! Note     : 'Configuration register is 0x2102' is parsed into
!            device.config_register and shown among the device's facts. No
!            mapped control evaluates it yet, so it produces no verdict — it is
!            evidence, not a finding. 0x2142 would be the interesting value
!            (it tells the router to ignore its startup config on boot); this
!            fixture uses the normal one because a fixture should not imply a
!            verdict the rule packs cannot deliver.
!
! Config posture is deliberately middling. This fixture tests identity
! extraction, so no score is asserted against it.
! ============================================================================
version 15.7
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
!
hostname branch-rtr-07
!
boot-start-marker
boot system flash0:c2900-universalk9-mz.SPA.157-3.M5.bin
boot-end-marker
!
enable secret 9 $9$branchrtrhash
!
aaa new-model
aaa authentication login default group radius local
aaa authorization exec default group radius local
aaa accounting exec default start-stop group radius
!
clock timezone IST 5 30
!
no ip domain-lookup
ip domain-name branch.praman.local
!
ip cef
no ipv6 cef
!
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
no ip http secure-server
no ip finger
no ip bootp server
no service dhcp
no cdp run
!
interface GigabitEthernet0/0
 description WAN - MPLS to core
 ip address 172.20.7.2 255.255.255.252
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/1
 description LAN - branch users
 ip address 10.7.0.1 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 duplex auto
 speed auto
 no shutdown
!
interface Loopback0
 description MANAGEMENT
 ip address 10.255.7.7 255.255.255.255
!
router ospf 10
 router-id 10.255.7.7
 passive-interface default
 no passive-interface GigabitEthernet0/0
 network 10.7.0.0 0.0.0.255 area 7
 network 172.20.7.0 0.0.0.3 area 0
!
ip route 0.0.0.0 0.0.0.0 172.20.7.1
!
logging buffered 51200 informational
logging host 10.99.0.50
logging trap informational
logging source-interface Loopback0
!
ntp authenticate
ntp authentication-key 7 md5 0745B1F0A5
ntp trusted-key 7
ntp server 10.99.0.60 key 7
ntp source Loopback0
!
snmp-server group praman-ro v3 priv read praman-view
snmp-server view praman-view iso included
!
banner login ^C
Authorised access only. Activity on this device is logged and monitored.
Disconnect immediately if you are not an authorised user.
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login authentication default
line aux 0
 no exec
 transport input none
line vty 0 4
 exec-timeout 9 0
 login authentication default
 transport input ssh
 transport output ssh
!
end

