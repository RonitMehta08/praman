! ============================================================================
! PRAMAN test fixture — switch stack, config bundled with show-version output
! ============================================================================
! Category : device_identity
! Vendor   : cisco_ios
! Purpose  : Proves PS 26155 C4's device-identity requirement end to end. C4
!            asks the report to identify a device "including serial numbers and
!            hardware", and NEITHER appears anywhere in a running-config. They
!            come from 'show version' and 'show inventory' text bundled into the
!            same upload, which is how a real collection script hands a config
!            over.
!
!            Every other fixture in this library is config-only, so before this
!            file existed device.serials and device.hardware were [] on every
!            device in the database and the device report said so honestly — a
!            correct message about a capability nothing exercised.
!
! Asserted : tests/test_device_identity.py
!            serials  == FDO1732H0KL, FDO1801J1AB, FDO1902K2CD, FDO1834M7QP
!            hardware includes every stack member PID
!            service.password_recovery is True
!
! Why a stack: serials and hardware are list[str] precisely because a stacked
!            chassis has more than one of each, and because the dedup in
!            generic.py must keep first-seen order (member 1 before member 2)
!            while collapsing the serial that 'show version' and
!            'show inventory' both report. A single-chassis fixture would pass
!            with a str field and never notice.
!
!            Four members, four serials, no more and no less — that equality is
!            the point of the assertion. FDO1732H0KL is printed three times
!            ('Processor board ID', 'System serial number', and member 1's
!            inventory SN) and must appear once. The board and power-supply
!            serials in 'show version' must NOT appear at all: device.serials is
!            unlabelled and its reader is an auditor matching an asset register,
!            which tracks chassis. See the note beside inventory_pid_sn in
!            data/ingest/patterns/cisco_ios.yaml.
!
! Config posture is deliberately middling — this fixture exists to test identity
! extraction, not to hit a score target, so the score is not asserted.
! ============================================================================
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service pad
!
hostname core-sw-01
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$stackswitchhash
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
no ip domain-lookup
ip domain-name lab.praman.local
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
no ip http server
no ip http secure-server
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
vlan internal allocation policy ascending
!
interface GigabitEthernet1/0/1
 description ACCESS - floor 3 north
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0/48
 description UPLINK - to core-rtr-01
 switchport mode trunk
 switchport trunk allowed vlan 30,40,99
 no shutdown
!
interface Vlan99
 description MANAGEMENT
 ip address 10.99.0.11 255.255.255.0
 no shutdown
!
ip default-gateway 10.99.0.1
!
logging buffered 32768 informational
logging host 10.99.0.50
logging trap informational
logging source-interface Vlan99
!
ntp authenticate
ntp server 10.99.0.60
!
snmp-server group praman-ro v3 priv read praman-view
snmp-server view praman-view iso included
!
banner login ^C
Authorised access only. Activity is logged and monitored.
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login authentication default
line vty 0 4
 exec-timeout 9 0
 login authentication default
 transport input ssh
 transport output ssh
line vty 5 15
 exec-timeout 9 0
 login authentication default
 transport input ssh
 transport output ssh
!
end

