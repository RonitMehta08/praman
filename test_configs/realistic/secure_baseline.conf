! ============================================================================
! PRAMAN test fixture — well-run production router
! ============================================================================
! Category : realistic
! Vendor   : cisco_ios
! Measured : 74.6% CIS (44 pass / 15 fail / 1 unknown / 11 n/a)
! Purpose  : A competently hardened router that still misses a benchmark's
!            finer points — the ordinary case an auditor actually meets. It is
!            the fixture to demo against, because the score needs reading
!            rather than announcing.
!
! NOTE: this file was originally headed "ALL rules should PASS". It never did,
!       and it is not meant to: the aspiration belongs to
!       compliance_extremes/fully_hardened.conf, which is asserted at 100% and
!       exists so that any failure there is a rule defect. Here the 15 failures
!       are real gaps in the device (no exec banner, no ip domain-name, CDP
!       left running, and so on) and are the point of the fixture. Do not
!       "fix" them — fix the header if the score moves, and see
!       test_configs/README.md for why realistic scores are not asserted.
! ============================================================================
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service pad
no service finger
no service config
!
hostname secure-gw-01
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$securescrypthash
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authentication enable default group tacacs+ enable
aaa authorization exec default group tacacs+ local
aaa accounting commands 15 default start-stop group tacacs+
aaa accounting exec default start-stop group tacacs+
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh source-interface Loopback0
!
no ip http server
no ip http secure-server
!
no ip source-route
!
snmp-server group SNMPV3GROUP v3 priv
snmp-server view READVIEW iso included
snmp-server community SecureStr1ng!2026 RO MGMT-ACL
snmp-server host 10.10.0.100 version 3 priv admin
snmp-server enable traps
!
logging host 10.10.0.200
logging host 10.10.0.201
logging buffered 65536 informational
logging trap informational
logging console critical
logging source-interface Loopback0
!
ntp server 10.10.0.50
ntp server 10.10.0.51
ntp authenticate
ntp authentication-key 1 md5 NtpK3y!Secure
ntp trusted-key 1
!
banner login ^
*************************************************************
WARNING: This system is the property of Example Corp.
Unauthorized access is strictly prohibited and will be
prosecuted to the fullest extent of the law. All activity
on this system is monitored and recorded.
*************************************************************
^
!
banner motd ^
Authorized users only. Disconnect immediately if you are not
an authorized user. By continuing, you consent to monitoring.
^
!
interface Loopback0
 description Management Loopback
 ip address 10.10.255.1 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description WAN Uplink to ISP
 ip address 203.0.113.1 255.255.255.252
 ip access-group WAN-INBOUND in
 no shutdown
!
interface GigabitEthernet0/1
 description Internal LAN
 ip address 10.10.0.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description DMZ Segment
 ip address 172.16.0.1 255.255.255.0
 no shutdown
!
interface Vlan99
 description Unused — Administratively Down
 shutdown
!
line con 0
 exec-timeout 5 0
 login authentication default
 transport input none
 logging synchronous
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class 10 in
!
line vty 5 15
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class 10 in
!
ip access-list extended MGMT-ACL
 10 permit ip 10.10.0.0 0.0.0.255 any
 20 deny ip any any log
!
ip access-list extended WAN-INBOUND
 10 deny ip 10.0.0.0 0.255.255.255 any log
 20 deny ip 172.16.0.0 0.15.255.255 any log
 30 deny ip 192.168.0.0 0.0.255.255 any log
 40 permit tcp any host 203.0.113.1 eq 443
 50 deny ip any any log
!
end
