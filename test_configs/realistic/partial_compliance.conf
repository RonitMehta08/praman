! ============================================================================
! PRAMAN test fixture — partially hardened branch router
! ============================================================================
! Category : realistic
! Vendor   : cisco_ios
! Measured : 41.8% CIS (23 pass / 32 fail / 1 unknown / 15 n/a)
! Purpose  : Hardening that was started and not finished — AAA and SSH are
!            configured correctly while logging, NTP, banners and SNMP are
!            missing or wrong. The mixed result is what exercises the findings
!            table's filtering and grouping, and the one 'unknown' keeps the
!            tri-state visible in the UI: absence of evidence renders as
!            unknown, never as a pass.
! ============================================================================
version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service pad
!
hostname mixed-sw-01
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mixed$hashvalue1234
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
ip ssh time-out 120
ip ssh authentication-retries 5
!
no ip http server
ip http secure-server
!
! FAIL: Default SNMP community string
snmp-server community public RO
snmp-server host 10.5.0.100
snmp-server enable traps
!
! FAIL: No remote logging configured
logging buffered 8192 debugging
logging console debugging
!
! FAIL: No NTP configured
!
! FAIL: No login banner
!
interface Vlan1
 ip address 10.5.0.1 255.255.255.0
 no shutdown
!
interface Vlan10
 description Server VLAN
 ip address 10.5.10.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description Trunk to Distribution
 switchport mode trunk
 no shutdown
!
line con 0
 exec-timeout 5 0
 login authentication default
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class 10 in
!
ip access-list extended MGMT-ACL
 10 permit ip 10.5.0.0 0.0.0.255 any
!
end
