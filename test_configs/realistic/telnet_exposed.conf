! ============================================================================
! PRAMAN test fixture — telnet-exposed edge router
! ============================================================================
! Category : realistic
! Vendor   : cisco_ios
! Measured : 17.2% CIS (10 pass / 48 fail / 1 unknown / 12 n/a)
! Purpose  : A router reachable over telnet with SNMPv1 default communities and
!            no AAA — the remote-management-plane exposure that the high
!            severity band exists for. Drives the severity distribution chart,
!            since almost every failure here is rated high.
!
! The conditions below are also the substance of DISA STIG NDM findings
! V-215823 (SNMP community strings), V-215832 (non-FIPS crypto, enable
! password type 0), V-215844 (SSH v1), V-215845 (VTY transport input telnet),
! V-220139 (default community "public") and V-220140 (no AAA). Those V-IDs are
! currently reported 'notchecked' — the STIG mapping packs are not written yet
! (docs/GAPS.md) — so today this file is scored against CIS only. It is
! deliberately kept as the fixture those STIG rules will be validated with.
!
! WARNING: the community strings and passwords below are well-known defaults.
! This file exists to be flagged. Do not copy any line of it.
! ============================================================================
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname vuln-edge-01
!
boot-start-marker
boot-end-marker
!
! STIG V-215832 FAIL: Type 0 cleartext password
enable password AdminPass2026!
!
! STIG V-220140 FAIL: No AAA
!
! STIG V-215844 FAIL: SSH version 1
ip ssh version 1
ip ssh time-out 120
ip ssh authentication-retries 5
!
ip http server
!
! STIG V-215823 FAIL: SNMP v1/v2 community strings
! STIG V-220139 FAIL: Default community string "public"
snmp-server community public RO
snmp-server community private RW
snmp-server host 10.20.0.100
snmp-server enable traps
!
logging host 10.20.0.200
logging buffered 4096 warnings
logging trap warnings
!
ntp server 10.20.0.50
!
banner login ^
WARNING: Authorized access only.
^
!
interface GigabitEthernet0/0
 description Internet Edge
 ip address 198.51.100.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description Internal Network
 ip address 10.20.0.1 255.255.255.0
 no shutdown
!
interface Vlan1
 ip address 10.20.1.1 255.255.255.0
 no shutdown
!
! STIG V-215845 FAIL: Telnet allowed on VTY
line con 0
 exec-timeout 30 0
 transport input none
!
line aux 0
 exec-timeout 0 0
 transport input all
!
line vty 0 4
 exec-timeout 60 0
 transport input telnet ssh
!
line vty 5 15
 exec-timeout 60 0
 transport input telnet
!
end
