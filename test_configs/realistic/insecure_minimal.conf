! ============================================================================
! PRAMAN test fixture — minimal, dangerously misconfigured router
! ============================================================================
! Category : realistic
! Vendor   : cisco_ios
! Measured : 10.3% CIS (6 pass / 52 fail / 1 unknown / 12 n/a), 74 facts
! Purpose  : The smallest config that still parses — a device someone put into
!            service without hardening it. Short enough that the full findings
!            list fits on one screen, which makes it the fixture for walking
!            through evidence drill-down and remediation output.
!
!            It is not the false-negative detector; that is
!            compliance_extremes/fully_noncompliant.conf, which is asserted at
!            exactly 0% so that any pass there is a missed finding. The 6 passes
!            here are genuine — a bad config still gets a few defaults right,
!            and a fixture that pretended otherwise would be teaching the rules
!            the wrong lesson.
!
! WARNING: the credentials below are well-known defaults. This file exists to
! be flagged. Do not copy any line of it.
! ============================================================================
version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname insecure-rtr-01
!
boot-start-marker
boot-end-marker
!
enable password cisco123
!
no aaa new-model
!
ip ssh version 1
!
ip http server
no ip http secure-server
!
snmp-server community public RO
snmp-server community private RW
!
no logging host
no logging buffered
no logging trap
!
no ntp server
no ntp authenticate
!
no banner login
!
interface Vlan1
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
line con 0
 no exec-timeout
 no login
!
line aux 0
 exec-timeout 0 0
!
line vty 0 4
 exec-timeout 0 0
 no login
 transport input telnet
!
line vty 5 15
 exec-timeout 0 0
 no login
 transport input telnet
!
ip source-route
!
end
