! ============================================================================
! PRAMAN test fixture — large enterprise distribution switch
! ============================================================================
! Category : realistic
! Vendor   : cisco_ios
! Measured : 79.0% CIS (49 pass / 13 fail / 0 unknown / 9 n/a), 430 facts,
!            18 unparsed lines — the largest fixture, and the parser's
!            scale case.
! Purpose  : Parser robustness on a config of production size and messiness:
!            many interfaces, complex ACLs, VLAN trunking, a half-finished
!            SNMPv3 migration, route-maps and prefix-lists.
!
!            The 18 unparsed lines are deliberate. Route-maps, prefix-lists and
!            BGP peering statements are constructs no shipped rule reads, so
!            the pattern pack does not claim them — and a parser that silently
!            dropped them would be indistinguishable from one that understood
!            them. They are reported instead, which is what makes this fixture
!            the input for the Training GUI demo: these are the lines you teach
!            the parser without redeploying the backend.
! ============================================================================
version 15.7
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
no service pad
no service finger
no service config
service tcp-keepalives-in
service tcp-keepalives-out
!
hostname enterprise-core-01
!
boot-start-marker
boot system flash:c7200-adventerprisek9-mz.157-3.M.bin
boot-end-marker
!
enable secret 5 $1$Ent3r$hashedvaluehere12345
!
aaa new-model
aaa authentication login default group radius local
aaa authentication login CONSOLE local
aaa authentication enable default group radius enable
aaa authorization exec default group radius local
aaa authorization commands 15 default group radius local
aaa accounting commands 15 default start-stop group radius
aaa accounting exec default start-stop group radius
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh source-interface Loopback0
ip ssh logging events
!
no ip http server
ip http secure-server
ip http authentication aaa
!
no ip source-route
no ip gratuitous-arps
!
! SNMP — partial v3 migration (v2c community still present = STIG fail)
snmp-server community EntMonitor2026 RO SNMP-ACL
snmp-server group NETOPS v3 priv read ALLVIEW
snmp-server user netops NETOPS v3 auth sha AuthK3y! priv aes 256 PrivK3y!
snmp-server host 10.100.0.50 version 3 priv netops
snmp-server host 10.100.0.51 version 2c EntMonitor2026
snmp-server enable traps
snmp-server ifindex persist
!
logging discriminator SECURITY severity includes 0 1 2 3
logging host 10.100.0.200 discriminator SECURITY
logging host 10.100.0.201
logging buffered 131072 informational
logging trap informational
logging console critical
logging source-interface Loopback0
logging origin-id hostname
!
ntp server 10.100.0.10 prefer
ntp server 10.100.0.11
ntp authenticate
ntp authentication-key 1 md5 NtpEntK3y!
ntp authentication-key 2 md5 NtpBkupK3y!
ntp trusted-key 1
ntp trusted-key 2
ntp source Loopback0
!
banner login ^
================================================================
                    ENTERPRISE CORP NETWORK
================================================================
WARNING: This is a private computer system. Unauthorized access
or use is prohibited and subject to criminal and civil penalties.
All activities on this system are logged and monitored.
================================================================
^
!
banner motd ^
Scheduled maintenance: Every Sunday 03:00-05:00 UTC
Contact NOC: noc@enterprise.example.com | +1-555-0100
^
!
! Interfaces — complex enterprise topology
interface Loopback0
 description Router-ID / Management
 ip address 10.100.255.1 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description WAN to MPLS PE — Provider A
 ip address 203.0.113.2 255.255.255.252
 ip access-group WAN-IN in
 ip access-group WAN-OUT out
 no cdp enable
 no shutdown
!
interface GigabitEthernet0/1
 description WAN to Internet — Provider B
 ip address 198.51.100.2 255.255.255.252
 ip access-group INET-IN in
 ip access-group INET-OUT out
 no cdp enable
 no shutdown
!
interface GigabitEthernet0/2
 description Trunk to Distribution Layer
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,99
 spanning-tree portfast trunk
 no shutdown
!
interface GigabitEthernet0/3
 description Server Farm Uplink
 ip address 10.100.10.1 255.255.255.0
 no shutdown
!
interface Vlan10
 description Corporate Users
 ip address 10.100.20.1 255.255.255.0
 ip helper-address 10.100.10.10
 no shutdown
!
interface Vlan20
 description Guest Network
 ip address 10.100.30.1 255.255.255.0
 ip access-group GUEST-RESTRICT in
 no shutdown
!
interface Vlan30
 description VoIP VLAN
 ip address 10.100.40.1 255.255.255.0
 no shutdown
!
interface Vlan40
 description IoT / Building Systems
 ip address 10.100.50.1 255.255.255.0
 ip access-group IOT-RESTRICT in
 no shutdown
!
interface Vlan99
 description Unused — Black Hole
 shutdown
!
! Lines
line con 0
 exec-timeout 5 0
 login authentication CONSOLE
 transport input none
 logging synchronous
 stopbits 1
!
line aux 0
 no exec
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class MGMT-SSH in
!
line vty 5 15
 exec-timeout 10 0
 login authentication default
 transport input ssh
 access-class MGMT-SSH in
!
! ACLs — complex enterprise rulesets
ip access-list extended WAN-IN
 10 deny ip 10.0.0.0 0.255.255.255 any log
 20 deny ip 172.16.0.0 0.15.255.255 any log
 30 deny ip 192.168.0.0 0.0.255.255 any log
 40 deny ip 127.0.0.0 0.255.255.255 any log
 50 deny ip host 0.0.0.0 any log
 60 permit tcp any host 203.0.113.2 eq bgp
 70 permit icmp any any echo
 80 permit icmp any any echo-reply
 90 permit icmp any any unreachable
 100 deny ip any any log
!
ip access-list extended WAN-OUT
 10 permit ip 10.100.0.0 0.0.255.255 any
 20 deny ip any any log
!
ip access-list extended INET-IN
 10 deny ip 10.0.0.0 0.255.255.255 any log
 20 permit tcp any any established
 30 permit udp any eq domain any
 40 deny ip any any log
!
ip access-list extended INET-OUT
 10 permit ip 10.100.0.0 0.0.255.255 any
 20 deny ip any any log
!
ip access-list extended GUEST-RESTRICT
 10 permit udp any any eq domain
 20 permit tcp any any eq 80
 30 permit tcp any any eq 443
 40 deny ip any 10.100.0.0 0.0.255.255 log
 50 permit ip any any
!
ip access-list extended IOT-RESTRICT
 10 permit udp any host 10.100.10.10 eq syslog
 20 permit tcp any host 10.100.10.11 eq 8883
 30 deny ip any 10.100.20.0 0.0.0.255 log
 40 deny ip any 10.100.30.0 0.0.0.255 log
 50 permit ip any any
!
ip access-list extended MGMT-SSH
 10 permit ip 10.100.0.0 0.0.0.255 any
 20 permit ip host 10.100.255.1 any
 30 deny ip any any log
!
ip access-list standard SNMP-ACL
 10 permit 10.100.0.50
 20 permit 10.100.0.51
 30 deny any log
!
! Route-maps and prefix-lists (parser may not recognise these)
ip prefix-list DEFAULT-ROUTE seq 5 permit 0.0.0.0/0
ip prefix-list INTERNAL-ROUTES seq 5 permit 10.100.0.0/16 le 32
!
route-map PROVIDER-A-IN permit 10
 match ip address prefix-list INTERNAL-ROUTES
 set local-preference 200
!
route-map PROVIDER-A-IN deny 20
!
route-map PROVIDER-B-IN permit 10
 match ip address prefix-list DEFAULT-ROUTE
 set local-preference 100
!
! BGP (parser may not recognise this block)
router bgp 65001
 bgp log-neighbor-changes
 neighbor 203.0.113.1 remote-as 65000
 neighbor 198.51.100.1 remote-as 65100
 address-family ipv4 unicast
  network 10.100.0.0 mask 255.255.0.0
  neighbor 203.0.113.1 route-map PROVIDER-A-IN in
  neighbor 198.51.100.1 route-map PROVIDER-B-IN in
 exit-address-family
!
! TACACS+ / RADIUS (parser may not recognise)
radius-server host 10.100.10.20 auth-port 1812 acct-port 1813 key RadiusK3y!
radius-server host 10.100.10.21 auth-port 1812 acct-port 1813 key RadiusK3y!
radius-server timeout 5
radius-server retransmit 3
!
! Crypto (parser likely won't parse this)
crypto key generate rsa modulus 4096
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400
!
end
