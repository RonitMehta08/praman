config firewall address
    edit "USER-LAN-NET"
        set uuid 8e701fdf-1111-1111-1111-111111111111
        set subnet 192.168.1.0 255.255.255.0
        set associated-interface "port3"
        set color 3
        set comment "User access LAN"
    next
    edit "MGMT-JUMPHOSTS"
        set uuid 9f812e00-2222-2222-2222-222222222222
        set subnet 10.20.0.0 255.255.255.0
        set color 5
    next
    edit "DMZ-WEB-VIP"
        set uuid a0923f11-3333-3333-3333-333333333333
        set subnet 203.0.113.20 255.255.255.255
        set associated-interface "port4"
        set color 7
    next
    edit "RFC1918-BOGONS"
        set uuid b1a34022-4444-4444-4444-444444444444
        set subnet 10.0.0.0 255.0.0.0
        set color 9
        set comment "Anti-spoof source group member"
    next
end
config firewall service custom
    edit "SNMP"
        set category "Network Services"
        set protocol-number 17
        set udp-portrange 161-162
    next
end
config router static
    edit 1
        set gateway 198.51.100.5
        set device "port1"
        set comment "Default route via transit provider"
    next
    edit 2
        set dst 10.0.0.0 255.0.0.0
        set gateway 10.20.0.254
        set device "port2"
        set comment "Enterprise summary via core"
    next
end
config system session-ttl
    set default 3600
end
config system replacemsg admin pre_admin-disclaimer-text
    set buffer "UNAUTHORISED ACCESS PROHIBITED. This system is monitored. All activity may be recorded and disclosed to law enforcement."
    set header http
    set format html
end
config system ha
    set group-name "PERIM-CLUSTER"
    set mode a-p
    set hbdev "port6" 50
    set password ENC REDACTEDFORTIOSHAPASSWORDFIXTURE==
    set override disable
    set priority 200
end
config system dhcp server
    edit 1
        set dns-service default
        set default-gateway 192.168.1.254
        set netmask 255.255.255.0
        set interface "port3"
        set dhcp-server enable
    next
end
