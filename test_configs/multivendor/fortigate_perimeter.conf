        set srcintf "port3"
        set dstintf "port1"
        set srcaddr "USER-LAN-NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set logtraffic all
        set nat enable
        set utm-status enable
        set ips-sensor "protect_client"
        set av-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set comments "General user web egress with UTM inspection"
    next
    edit 2
        set name "DMZ-Inbound-HTTPS"
        set uuid 4a3c2d9b-5555-6666-7777-888899990000
        set srcintf "port1"
        set dstintf "port4"
        set srcaddr "all"
        set dstaddr "DMZ-WEB-VIP"
        set action accept
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
        set utm-status enable
        set ips-sensor "protect_server"
        set comments "Published web service"
    next
    edit 3
        set name "MGMT-to-Devices"
        set uuid 5b4d3eac-9999-0000-1111-222233334444
        set srcintf "port2"
