#config-version=FGT60F-7.4.4-FW-build2662-240514:opmode=0:vdom=0:user=admin
#conf_file_ver=28472619384756102
#buildno=2662
#global_vdom=1
config system global
    set admin-concurrent enable
    set admin-console-timeout 300
    set admin-https-redirect enable
    set admin-lockout-duration 300
    set admin-lockout-threshold 3
    set admin-port 80
    set admin-scp enable
    set admin-sport 8443
    set admin-ssh-grace-time 30
    set admin-ssh-port 22
    set admin-ssh-v1 disable
    set admin-telnet disable
    set admin-maintainer disable
    set admintimeout 5
    set alias "FGT-PERIM-01"
    set cli-audit-log enable
    set fips-cc-mode disable
    set hostname "fgt-perim-01"
    set post-login-banner enable
    set pre-login-banner enable
    set ssh-enc-algo aes128-ctr aes256-ctr aes128-gcm@openssh.com aes256-gcm@openssh.com
    set ssh-kex-algo diffie-hellman-group-exchange-sha256 ecdh-sha2-nistp384 ecdh-sha2-nistp521
    set ssh-mac-algo hmac-sha2-256 hmac-sha2-512 hmac-sha2-256-etm@openssh.com
    set strong-crypto enable
    set timezone "Asia/Kolkata"
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
    set admin-server-cert "Fortinet_Factory"
    set ssl-min-proto-version TLSv1-2
    set auto-install-config disable
    set lldp-transmission disable
    set revision-backup-on-logout enable
    set switch-controller disable
end
config system password-policy
    set status enable
    set apply-to admin-password
    set minimum-length 15
    set min-lower-case-letter 2
    set min-upper-case-letter 2
    set min-non-alphanumeric 2
    set min-number 2
    set expire-status enable
    set expire-day 60
    set reuse-password disable
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set trusthost1 10.20.0.0 255.255.255.0
        set trusthost2 10.20.1.0 255.255.255.0
        set two-factor fortitoken
        set remote-auth disable
        set password ENC REDACTEDFORTIOSADMINPASSWORDHASHFIXTUREONLY==
    next
    edit "netops"
        set accprofile "prof_netops"
        set vdom "root"
        set trusthost1 10.20.0.0 255.255.255.0
        set remote-auth enable
        set remote-group "RADIUS-NetOps"
        set ssh-public-key1 "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIREDACTEDPUBLICKEYFIXTURE netops@corp"
    next
    edit "auditor"
        set accprofile "prof_readonly"
        set vdom "root"
        set trusthost1 10.20.0.0 255.255.255.0
        set two-factor fortitoken
        set password ENC REDACTEDFORTIOSAUDITORPASSWORDHASHFIXTURE==
    next
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 198.51.100.6 255.255.255.252
        set allowaccess ping
        set alias "WAN-TRANSIT"
        set role wan
        set src-check enable
        set status up
        set mtu 1500
    next
    edit "port2"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set allowaccess ping https ssh
        set alias "MGMT-INSIDE"
        set role lan
        set src-check enable
        set status up
        set device-identification enable
    next
    edit "port3"
        set vdom "root"
        set ip 192.168.1.254 255.255.255.0
        set allowaccess ping
        set alias "USER-LAN"
        set role lan
        set src-check enable
        set status up
        set dhcp-relay-ip "10.20.0.40"
    next
    edit "port4"
        set vdom "root"
        set ip 203.0.113.17 255.255.255.240
        set allowaccess ping
        set alias "DMZ"
        set role dmz
        set src-check enable
        set status up
    next
    edit "port5"
        set vdom "root"
        set alias "SPARE-DECOMMISSIONED"
        set status down
    next
    edit "vlan100"
        set vdom "root"
        set ip 10.100.0.1 255.255.255.0
        set allowaccess ping
        set alias "SERVER-VLAN"
        set role lan
        set interface "port2"
        set vlanid 100
    next
end
config system dns
    set primary 10.20.0.53
    set secondary 10.20.0.54
    set domain "corp.example.net"
end
config system ntp
    set ntpsync enable
    set type custom
    set syncinterval 60
    set source-ip 10.20.0.1
    config ntpserver
        edit 1
            set server 10.30.0.10
            set authentication enable
            set key-id 7
            set key ENC REDACTEDFORTIOSNTPKEYFIXTUREONLY==
        next
        edit 2
            set server 10.30.0.11
            set authentication enable
            set key-id 7
            set key ENC REDACTEDFORTIOSNTPKEYFIXTUREONLY==
        next
    end
end
config system snmp sysinfo
    set status enable
    set description "FortiGate 60F perimeter firewall - Mumbai DC1"
    set location "Mumbai DC1 Rack A16"
    set contact-info "netops@corp.example.net"
end
config system snmp community
    edit 1
        set name "public"
        set query-v1-status disable
        set query-v2c-status enable
        set trap-v1-status disable
        set trap-v2c-status enable
        set ip 10.20.0.0 255.255.255.0
    next
end
config system snmp user
    edit "snmpv3-monitor"
        set security-level auth-priv
        set auth-proto sha256
        set priv-proto aes256
        set notify-hosts 10.20.0.50
    next
end
config log syslogd setting
    set status enable
    set server 10.20.0.50
    set port 6514
    set mode reliable
    set facility local7
    set source-ip 10.20.0.1
    set enc-algorithm high
    set ssl-min-proto-version TLSv1-2
end
config log syslogd2 setting
    set status enable
    set server 10.20.0.51
    set port 514
    set mode udp
    set facility local6
end
config log memory setting
    set status enable
end
config log setting
    set local-in-allow enable
    set local-out enable
    set resolve-ip disable
    set user-anonymize disable
end
config log eventfilter
    set event enable
    set system enable
    set user enable
end
config user radius
    edit "RADIUS-NetOps"
        set server 10.20.0.60
        set secondary-server 10.20.0.61
        set secret ENC REDACTEDFORTIOSRADIUSSECRETFIXTURE==
        set auth-type auto
        set timeout 5
        set source-ip 10.20.0.1
    next
end
